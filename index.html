<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dash — your personal dashboard</title>
<meta name="description" content="Dash: a fast, installable personal dashboard with DashFit triathlon training and DashHoops live basketball scores.">
<meta name="theme-color" content="#f7f4ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dash">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="shared/base.css">
<style>.hero{margin:6px 0 16px}.hero h2{font-size:1.5rem;margin:0}.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{margin:0;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--acc);min-height:190px}.tlink{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);min-height:56px}
.tlink img{border-radius:12px}.tlink span:nth-child(2){flex:1}.tlink b{display:block;font-size:1.1rem}.tlink small{color:var(--muted)}.go{font-size:1.8rem;color:var(--acc)}
.tlink:hover b{color:var(--acc)}.big b{font-size:1.6rem;color:var(--hi-text);margin-right:8px}.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--card2);margin:8px 0}
.mini{list-style:none;margin:0;padding:0}.mini li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}.mini li:first-child{border:0}
.widget{min-height:96px}#w-nba{min-height:196px}#today{min-height:1.5em}.soon{border:2px dashed var(--line);box-shadow:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);min-height:120px}</style></head>
<body><a class="skip" href="#main">Skip to content</a>
<header class="bar"><h1><img class="logo" src="icons/icon-192.png" width="34" height="34" alt=""><span>Dash<small>Your personal dashboard</small></span></h1></header>
<main id="main"><div class="hero"><h2 id="greet">Hello 👋</h2><p class="muted" id="today"></p></div>
<section class="apps" id="apps" aria-label="Apps"></section>
<div class="card soon" style="margin-top:14px">More apps coming soon</div></main>
<footer>Dash · Version <span data-version>dev</span> · Scores data from ESPN's public API; not affiliated with ESPN, the NBA, or IRONMAN®.</footer>
<script src="shared/update.js" defer></script><script src="apps.js" defer></script><script src="hub.js" defer></script></body></html>
