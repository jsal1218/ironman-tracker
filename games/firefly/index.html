<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Firefly Trail — glowing snake game</title><meta name="description" content="Firefly Trail: guide a firefly through a midnight meadow, gather dew lights to grow your glowing trail, and slip through the edges without biting your own tail.">
<meta name="theme-color" content="#07140f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/svg+xml" href="../../icons/firefly.svg"><link rel="apple-touch-icon" href="../../icons/games-192.png">
<script src="../../shared/theme.js"></script><link rel="stylesheet" href="../games.css"><style>body.fs{--gbg:#07140f}</style></head>
<body class="fs" data-game="firefly">
<header class="gbar"><a href="../" aria-label="Back to Games"><svg class="i" aria-hidden="true"><use href="../../shared/icons.svg#back"/></svg>Games</a><h1 class="vh">Firefly Trail</h1>
<div class="hud"><div class="pillh"><span>Score</span><b id="sc">0</b></div><div class="pillh"><span>Length</span><b id="ln">0</b></div></div><span style="margin-left:auto"></span><button class="gbtn" id="pause" aria-label="Pause"><svg class="i" aria-hidden="true"><use href="../../shared/icons.svg#pause"/></svg></button><button class="gbtn" id="sound"></button></header>
<main><div class="stage" id="stage" role="application" aria-label="Firefly Trail. Swipe or use arrow keys to steer the firefly."><canvas id="cv"></canvas>
<div class="overlay" id="ov" hidden><div class="panel"><h2></h2><p></p><button class="play"></button></div></div></div></main>
<script src="../../shared/update.js" defer></script><script src="../common.js" defer></script><script src="firefly.js" defer></script></body></html>
