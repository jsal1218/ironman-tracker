<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canopy Run — treetop endless runner</title><meta name="description" content="Canopy Run: a red fox races across treetop branches at dusk. Tap to jump, hold to leap higher, double-jump over gaps, dodge brambles and gather acorns.">
<meta name="theme-color" content="#1b2a22"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/svg+xml" href="../../icons/canopy.svg"><link rel="apple-touch-icon" href="../../icons/games-192.png">
<script src="../../shared/theme.js"></script><link rel="stylesheet" href="../games.css"><style>body.fs{--gbg:#1b2a22}</style></head>
<body class="fs" data-game="canopy">
<header class="gbar"><a href="../" aria-label="Back to Games"><svg class="i" aria-hidden="true"><use href="../../shared/icons.svg#back"/></svg>Games</a><h1 class="vh">Canopy Run</h1>
<div class="hud"><div class="pillh"><span>Score</span><b id="sc">0</b></div><div class="pillh"><span>Acorns</span><b id="ac">0</b></div></div><span style="margin-left:auto"></span><button class="gbtn" id="pause" aria-label="Pause"><svg class="i" aria-hidden="true"><use href="../../shared/icons.svg#pause"/></svg></button><button class="gbtn" id="sound"></button></header>
<main><div class="stage" id="stage" role="application" aria-label="Canopy Run. Tap or press space to jump, hold for a higher jump, tap again in the air to double-jump."><canvas id="cv"></canvas>
<div class="overlay" id="ov" hidden><div class="panel"><h2></h2><p></p><button class="play"></button></div></div></div></main>
<script src="../../shared/update.js" defer></script><script src="../common.js" defer></script><script src="canopy.js" defer></script></body></html>
