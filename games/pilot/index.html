<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper Pilot — one-tap sunset flyer</title><meta name="description" content="Paper Pilot: tap to fly a paper plane through a sunset skyline. Fair hitboxes, parallax, and a smooth difficulty ramp.">
<meta name="theme-color" content="#fbf1d2"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/svg+xml" href="../../icons/pilot.svg"><link rel="apple-touch-icon" href="../../icons/games-192.png">
<script src="../../shared/theme.js"></script><link rel="stylesheet" href="../games.css">
<style>html,body{overflow:hidden}body{display:flex;flex-direction:column;height:100dvh}.gbar{position:absolute;top:0;left:0;right:0;z-index:5}
