<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloom Blocks — garden block puzzle</title><meta name="description" content="Bloom Blocks: drag flower beds onto an 8×8 garden, clear rows and columns, and chain combos. Clear previews and fair piece dealing.">
<meta name="theme-color" content="#eef3e2"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/svg+xml" href="../../icons/bloom.svg"><link rel="apple-touch-icon" href="../../icons/games-192.png">
<script src="../../shared/theme.js"></script><link rel="stylesheet" href="../games.css">
<style>html,body{overflow:hidden}body{display:flex;flex-direction:column;height:100dvh;background:#eef2e6}:root[data-theme=dark] body{background:#0b1612}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) body{background:#0b1612}}.stage{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto}canvas{display:block;width:100%;height:100%}.scores{padding-bottom:4px}</style></head>
<body data-game="bloom">
<header class="gbar"><a href="../" aria-label="Back to Games"><svg class="i" aria-hidden="true"><use href="../../shared/icons.svg#back"/></svg>Games</a><h1><img src="../../icons/bloom.svg" alt="" width="28" height="28">Bloom Blocks</h1><button class="gbtn" id="newBtn" aria-label="New game"><svg class="i" aria-hidden="true"><use href="../../shared/icons.svg#restart"/></svg></button><button class="gbtn" id="sound"></button></header>
<div class="scores"><div class="sc"><span>Score</span><b id="score">0</b></div><div class="sc"><span>Best</span><b id="best">0</b></div><div class="sc"><span>Combo</span><b id="combo">–</b></div></div>
<main style="flex:1;display:flex;flex-direction:column;min-height:0"><div class="stage" id="stage" role="application" aria-label="Bloom Blocks. Drag pieces from the tray onto the garden grid."><canvas id="cv"></canvas>
<div class="overlay" id="ov" hidden><div class="panel"><h2></h2><p></p><button class="play"></button></div></div></div></main>
<script src="../../shared/update.js" defer></script><script src="../common.js" defer></script><script src="bloom.js" defer></script></body></html>
