<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DashHoops — live pro basketball scores</title>
<meta name="description" content="DashHoops: every NBA game for any date with tip-off times, live scores that auto-update, records, and box scores.">
<meta name="theme-color" content="#f7f4ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DashHoops">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/svg+xml" href="../icons/hoops.svg"><link rel="apple-touch-icon" href="../icons/nba-192.png">
<link rel="preconnect" href="https://site.api.espn.com" crossorigin><link rel="preconnect" href="https://a.espncdn.com">
<script src="../shared/theme.js"></script><link rel="stylesheet" href="../shared/base.css">
<style>
.datebar{position:sticky;top:65px;z-index:4;background:var(--bg);padding:8px 0;margin-bottom:6px}
.datebar .row{flex-wrap:nowrap}.datebar input{flex:1;min-width:0}.datebar button{min-width:44px}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;min-height:100vh;align-content:start}#dateLbl,#upd{min-height:2.6em}.open{min-height:36px;padding:4px 10px;font-size:.85rem}
.game{margin:0;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.game.fav{border-left:4px solid var(--gold)}.game.is-live{border-color:var(--acc)}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;min-height:24px}
.team{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:4px 0}
.team img{width:32px;height:32px;object-fit:contain}.team .nm b{display:block;line-height:1.2}.team .nm small{color:var(--muted)}
.score{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;min-width:2ch;text-align:right}.lose{color:var(--muted);font-weight:600}
.star{border:0;background:none;padding:0;width:44px;color:var(--gold-text)}.star .i{width:22px;height:22px}
.banner{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
dialog{border:0;padding:0;width:min(760px,100%);max-height:100%;max-width:100%;border-radius:18px;background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(40,25,20,.45)}
@media(max-width:600px){dialog{width:100%;height:100%;border-radius:0;margin:0}}
.dhead{position:sticky;top:0;background:var(--card);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.dbody{padding:14px 16px}.tbl{overflow-x:auto;margin-bottom:16px}table{border-collapse:collapse;width:100%;font-size:.85rem;white-space:nowrap}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}th{color:var(--muted);font-weight:600}
.lead{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.lead div{background:var(--card2);border-radius:12px;padding:10px}
.skel{height:206px;border-radius:var(--r);background:linear-gradient(90deg,var(--card2),var(--card),var(--card2));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skel{animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}}
</style></head>
<body><a class="skip" href="#main">Skip to content</a>
<header class="bar"><a class="home" href="../" aria-label="Back to Dash home"><svg class="i" aria-hidden="true"><use href="../shared/icons.svg#back"/></svg>Dash</a><h1><img class="logo" src="../icons/hoops.svg" width="34" height="34" alt=""><span>DashHoops<small>Pro basketball scores</small></span></h1></header>
<main id="main">
<div class="datebar"><div class="row"><button id="prev" class="iconbtn" aria-label="Previous day"><svg class="i" aria-hidden="true"><use href="../shared/icons.svg#back"/></svg></button><label class="sr" for="date" style="position:absolute;left:-999px">Date</label><input type="date" id="date"><button id="next" class="iconbtn" aria-label="Next day"><svg class="i" aria-hidden="true"><use href="../shared/icons.svg#next"/></svg></button><button id="todayBtn">Today</button></div>
<div class="row between" style="margin-top:6px"><span class="muted" id="dateLbl"></span><span class="muted" id="upd" aria-live="off"></span></div></div>
<div id="msg"></div>
<section id="games" aria-label="Games" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>
</main>
<dialog id="detail" aria-labelledby="dTitle"><div class="dhead"><h2 id="dTitle" style="margin:0">Game</h2><button id="dClose" class="iconbtn" aria-label="Close"><svg class="i" aria-hidden="true"><use href="../shared/icons.svg#close"/></svg></button></div><div class="dbody" id="dBody"></div></dialog>
<footer>DashHoops · Version <span data-version>dev</span> · Data: ESPN public API. Not affiliated with or endorsed by the NBA or ESPN. Times in your local time zone. Tap the star next to a team to pin its games.</footer>
<script src="../shared/update.js" defer></script><script src="nba.js" defer></script></body></html>
